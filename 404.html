<style>

  /* ============ TOKENS ============ */
  :root{
    --ink:#251720;
    --ink-rgb:37,23,32;
    --ink-soft:#4A3540;
    --parchment:#F6ECE6;
    --parchment-2:#EAD7CE;
    --white:#FBF6F3;
    --wine:#8A4658;
    --wine-deep:#4A2436;
    --brass:#C0937A;
    --brass-soft:#E3C9AE;
    --brass-soft-rgb:227,201,174;

    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --ease: cubic-bezier(.22,.68,0,1);
  }

  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth; -webkit-text-size-adjust:100%;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  html, body{height:100%;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex; flex-direction:column;
  }

  a{color:inherit; text-decoration:none; -webkit-touch-callout:none;}
  img{display:block; max-width:100%; height:auto;}
  button{font:inherit; background:none; border:none; cursor:pointer; color:inherit; touch-action:manipulation;}
  ul{list-style:none;}

  :focus-visible{outline:1px solid var(--brass); outline-offset:4px;}

  .reveal{
    opacity:0; transform:translateY(28px);
    transition:opacity 1s var(--ease), transform 1s var(--ease);
    will-change:opacity, transform;
  }
  .reveal.is-visible{opacity:1; transform:none;}
  .no-js .reveal{opacity:1; transform:none;}

  .eyebrow{
    font-family:var(--sans);
    font-size:.68rem;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--wine);
    margin-bottom:1.1rem;
  }
  .eyebrow.center{text-align:center;}

  /* ============ NAV ============ */
  .site-nav{
    position:sticky; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(1.1rem + env(safe-area-inset-top)) clamp(1.25rem, 4vw, 3rem) 1.1rem;
    background-color:var(--ink);
    color:var(--white);
    box-shadow:0 1px 0 rgba(240,233,220,.08);
  }
  .wordmark{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:1.15rem;
    letter-spacing:.02em;
  }
  .menu-btn{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    padding:.9rem; margin:-.9rem;
    transition:opacity .3s ease;
  }
  .menu-btn:hover{opacity:.7;}
  .menu-btn-lines{display:flex; flex-direction:column; gap:6px; width:24px;}
  .menu-btn-lines span{
    display:block; height:1px; width:100%; background:currentColor;
    transition:transform .5s var(--ease), opacity .3s ease, width .4s var(--ease);
  }
  .menu-btn-lines span:last-child{width:70%; align-self:flex-end;}
  .menu-btn:hover .menu-btn-lines span:last-child{width:100%;}

  .nav-right{display:none;}

  @media (min-width:960px){
    .site-nav{
      padding-left:clamp(2.25rem, 4vw, 3.5rem);
      padding-right:clamp(2.25rem, 4vw, 3.5rem);
      padding-top:calc(1.1rem + env(safe-area-inset-top));
    }
    .wordmark{font-size:1.3rem;}
    .menu-btn{display:none;}
    .nav-right{
      display:flex; align-items:center;
      gap:clamp(1.9rem, 2.6vw, 2.6rem);
    }
    .nav-divider{width:1px; height:20px; background:rgba(var(--brass-soft-rgb),.35);}
    .nav-social{display:flex; align-items:center; gap:1rem;}
    .nav-social a{
      display:flex; align-items:center; justify-content:center;
      color:var(--white); opacity:.85;
      transition:opacity .3s ease, transform .35s var(--ease), color .3s ease;
    }
    .nav-social a:hover, .nav-social a:focus-visible{opacity:1; color:var(--brass-soft); transform:translateY(-1px);}
    .nav-social svg{width:16px; height:16px; flex:none;}
    .nav-cta{
      display:inline-flex; align-items:center;
      font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; font-weight:600;
      color:var(--white);
      border:1px solid rgba(var(--brass-soft-rgb),.55);
      border-radius:999px; padding:.65rem 1.4rem;
      transition:background-color .35s ease, border-color .35s ease, color .35s ease;
    }
    .nav-cta:hover, .nav-cta:focus-visible{
      background:var(--brass-soft); border-color:var(--brass-soft); color:var(--ink);
    }
  }

  /* ============ OVERLAY MENU ============ */
  .overlay-menu{
    position:fixed; inset:0; z-index:80;
    background:var(--ink); color:var(--white);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(2.5rem, 6vh, 4rem);
    opacity:0; visibility:hidden;
    transition:opacity .6s var(--ease), visibility 0s linear .6s;
  }
  .overlay-menu.is-open{
    opacity:1; visibility:visible;
    transition:opacity .6s var(--ease), visibility 0s linear 0s;
  }
  .overlay-close{
    position:absolute; top:calc(1.65rem + env(safe-area-inset-top)); right:clamp(1.25rem, 4vw, 3rem);
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; color:var(--white); opacity:.78;
    transition:opacity .35s var(--ease), color .35s var(--ease), transform .45s var(--ease);
  }
  .overlay-close:hover, .overlay-close:focus-visible{opacity:1; color:var(--brass-soft); transform:rotate(90deg);}
  .overlay-close svg{width:15px; height:15px; flex:none;}
  .overlay-links{
    display:flex; flex-direction:column; align-items:center; gap:1.1rem; text-align:center;
  }
  .overlay-links a{
    font-family:var(--serif); font-style:italic;
    font-size:clamp(2.2rem, 7vw, 3.4rem); font-weight:400;
    color:var(--parchment); transition:color .4s ease;
  }
  .overlay-links a:hover, .overlay-links a:focus-visible, .overlay-links a[aria-current="page"]{color:var(--brass-soft);}
  .overlay-social{display:flex; align-items:center; justify-content:center; gap:1rem;}
  .overlay-social a{
    display:flex; align-items:center; justify-content:center;
    width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(var(--brass-soft-rgb),.3);
    background:rgba(var(--brass-soft-rgb),.05);
    color:var(--parchment); opacity:.85;
    transition:opacity .3s ease, transform .4s var(--ease), background-color .3s ease, border-color .3s ease;
  }
  .overlay-social a:hover, .overlay-social a:focus-visible{
    opacity:1; transform:translateY(-2px);
    background:rgba(var(--brass-soft-rgb),.14); border-color:rgba(var(--brass-soft-rgb),.6);
  }
  .overlay-social svg{width:18px; height:18px; flex:none;}

  /* ============ 404 ============ */
  .error-main{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(3rem,10vh,5rem) clamp(1.25rem,4vw,3rem);
  }
  .error-inner{max-width:520px; text-align:center;}
  .error-code{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(5.5rem, 18vw, 9rem);
    line-height:1;
    color:var(--ink);
  }
  .error-rule{
    width:44px; height:1px;
    background:var(--brass);
    margin:1.6rem auto;
  }
  .error-title{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.6rem, 3.6vw, 2.1rem);
    color:var(--ink);
    margin-bottom:.9rem;
  }
  .error-text{
    max-width:38ch; margin:0 auto;
    font-size:clamp(.92rem, 1.5vw, .98rem);
    line-height:1.75;
    color:var(--ink-soft);
  }
  .error-home{
    position:relative; display:inline-block;
    margin-top:2.4rem;
    padding:.6rem .2rem;
    font-family:var(--sans);
    font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; font-weight:500;
    color:var(--wine);
  }
  .error-home::after{
    content:'';
    position:absolute; left:.2rem; right:.2rem; bottom:.35rem; height:1px;
    background:var(--wine);
    transform:scaleX(0); transform-origin:left;
    transition:transform .5s var(--ease);
  }
  .error-home:hover::after, .error-home:focus-visible::after{transform:scaleX(1);}

</style>
</head>
<body>

  <nav id="overlay-menu" class="overlay-menu" aria-hidden="true">

  <main class="error-main">
    <div class="error-inner reveal is-visible">
      <p class="error-code">404</p>
      <div class="error-rule" aria-hidden="true"></div>
      <h1 class="error-title">This page has left the stage</h1>
      <p class="error-text">The page you're looking for doesn't exist, or may have been moved. Let's get you back to the music.</p>
      <a class="error-home" href="/">Return Home</a>
    </div>
  </main>

<script>
(function(){
  var menuOpen = document.getElementById('menuOpen');
  var menuClose = document.getElementById('menuClose');
  var overlay = document.getElementById('overlay-menu');
  var menuLinks = overlay.querySelectorAll('[data-menu-link]');

  function openMenu(){
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden','false');
    menuOpen.setAttribute('aria-expanded','true');
    document.body.style.overflow = 'hidden';
    menuClose.focus();
  }
  function closeMenu(){
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden','true');
    menuOpen.setAttribute('aria-expanded','false');
    document.body.style.overflow = '';
    menuOpen.focus();
  }
  menuOpen.addEventListener('click', openMenu);
  menuClose.addEventListener('click', closeMenu);
  menuLinks.forEach(function(l){ l.addEventListener('click', closeMenu); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && overlay.classList.contains('is-open')) closeMenu();
  });
  overlay.addEventListener('click', function(e){
    if(!e.target.closest('[data-menu-link]')){ closeMenu(); }
  });
})();
</script>
